<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a1a2e" />

    <!-- SEO Meta Tags -->
    <title>Grayold Labs</title>
    <meta name="description" content="Grayold Labs: Blending ancient wisdom with modern innovation. Cutting-edge technology solutions transforming the way you work and create. Heritage & Innovation. Desert to Digital. Timeless Excellence." />
    <meta name="keywords" content="Grayold Labs, innovation, technology, UAE, desert technology, digital transformation, cutting-edge solutions, heritage innovation, modern technology" />
    <meta name="author" content="Grayold Labs" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://grayold.com/" />

    <!-- Favicon -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/favicon.svg">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://grayold.com/" />
    <meta property="og:title" content="Grayold Labs" />
    <meta property="og:description" content="Blending ancient wisdom with modern innovation. Our cutting-edge solutions will transform the way you work and create." />
    <meta property="og:image" content="https://grayold.com/og-image.jpg" />
    <meta property="og:site_name" content="Grayold Labs" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://grayold.com/" />
    <meta name="twitter:title" content="Grayold Labs - Innovation Meets Excellence" />
    <meta name="twitter:description" content="Blending ancient wisdom with modern innovation. Launching soon." />
    <meta name="twitter:image" content="https://grayold.com/og-image.jpg" />
    <meta name="twitter:creator" content="@grayoldlabs" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Grayold Labs",
      "url": "https://grayoldlabs.com",
      "logo": "https://grayoldlabs.com/favicon.svg",
      "description": "Blending ancient wisdom with modern innovation. Cutting-edge technology solutions transforming digital experiences.",
      "foundingDate": "2025",
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "Customer Service",
        "availableLanguage": ["English", "Arabic"]
      },
      "sameAs": [
        "https://twitter.com/grayoldlabs"
      ]
    }
    </script>

    <!-- Performance Optimization -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
